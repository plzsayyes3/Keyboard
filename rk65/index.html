<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RK65 JIS Mapper — Device Probe</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; background:#111; color:#eee; min-height:100vh; }
    main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:28px; margin:0 0 8px; }
    p { color:#aaa; line-height:1.7; }
    .card { border:1px solid #333; border-radius:16px; padding:18px; margin-top:18px; background:#181818; }
    button { appearance:none; border:0; border-radius:12px; padding:12px 18px; font-weight:700; font-size:16px; cursor:pointer; background:#eee; color:#111; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    pre { white-space:pre-wrap; word-break:break-word; background:#0c0c0c; border-radius:12px; padding:14px; overflow:auto; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .ok { color:#9fe3a5; } .warn { color:#ffd37a; } .bad { color:#ff9a9a; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  </style>
</head>
<body>
<main>
  <h1>RK65 JIS Mapper</h1>
  <p>Step 1: RK65 のUSB/HID情報を確認します。このページは読み取り専用で、キーマップやファームウェアを書き換えません。</p>

  <div class="card">
    <div id="support"></div>
    <p>RK65をUSBで接続し、Chrome / Edge / Operaで「デバイスを選択」を押してください。</p>
    <button id="pick">デバイスを選択</button>
    <button id="copy" disabled>結果をコピー</button>
  </div>

  <div class="card">
    <strong>検出結果</strong>
    <pre id="out">まだ接続していません。</pre>
  </div>
</main>
<script>
const out = document.querySelector('#out');
const pick = document.querySelector('#pick');
const copy = document.querySelector('#copy');
const support = document.querySelector('#support');

function hex(n, width=4) {
  return '0x' + Number(n ?? 0).toString(16).padStart(width, '0');
}

function simplifyCollection(c) {
  return {
    usagePage: hex(c.usagePage),
    usage: hex(c.usage),
    type: c.type ?? null,
    children: (c.children || []).map(simplifyCollection),
    inputReports: (c.inputReports || []).map(r => ({
      reportId: r.reportId,
      items: (r.items || []).map(i => ({
        reportSize: i.reportSize,
        reportCount: i.reportCount,
        usageMinimum: i.usageMinimum,
        usageMaximum: i.usageMaximum,
        isAbsolute: i.isAbsolute,
        isArray: i.isArray
      }))
    })),
    outputReports: (c.outputReports || []).map(r => ({
      reportId: r.reportId,
      items: (r.items || []).map(i => ({
        reportSize: i.reportSize,
        reportCount: i.reportCount
      }))
    })),
    featureReports: (c.featureReports || []).map(r => ({
      reportId: r.reportId,
      items: (r.items || []).map(i => ({
        reportSize: i.reportSize,
        reportCount: i.reportCount
      }))
    }))
  };
}

if (!('hid' in navigator)) {
  support.innerHTML = '<span class="bad">WebHID非対応ブラウザです。デスクトップ版Chrome / Edge / Operaを使ってください。</span>';
  pick.disabled = true;
} else {
  support.innerHTML = '<span class="ok">WebHID対応ブラウザです。</span>';
}

let lastText = '';

pick.addEventListener('click', async () => {
  try {
    const devices = await navigator.hid.requestDevice({ filters: [] });
    if (!devices.length) {
      out.textContent = 'デバイスが選択されませんでした。';
      return;
    }

    const rows = [];
    for (const d of devices) {
      const info = {
        productName: d.productName,
        vendorId: hex(d.vendorId),
        productId: hex(d.productId),
        opened: d.opened,
        collections: (d.collections || []).map(simplifyCollection)
      };
      rows.push(info);
    }

    lastText = JSON.stringify(rows, null, 2);
    out.textContent = lastText;
    copy.disabled = false;
  } catch (e) {
    out.textContent = 'ERROR\n' + (e?.stack || e);
  }
});

copy.addEventListener('click', async () => {
  if (!lastText) return;
  await navigator.clipboard.writeText(lastText);
  const old = copy.textContent;
  copy.textContent = 'コピーしました';
  setTimeout(() => copy.textContent = old, 1200);
});
</script>
</body>
</html>
